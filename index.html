<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Браузерний редактор і конвертер: Markdown, JSON, YAML, TOML, XML, CSV, HTML та код. Працює офлайн.">
<meta name="theme-color" content="#0c0e13">
<title>mdconv — редактор і конвертер</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<script>
  // Тема до першого рендеру, щоб не блимало
  try { document.documentElement.dataset.theme = localStorage.getItem('mdconv_theme') || 'dark'; } catch {}
</script>
  <script type="module" crossorigin src="./assets/index-Y7erahSi.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/codemirror-CUhtNSJO.js">
  <link rel="modulepreload" crossorigin href="./assets/data-BrFtMUp3.js">
  <link rel="modulepreload" crossorigin href="./assets/lazy/markdown-BEaK3L7Z.js">
  <link rel="modulepreload" crossorigin href="./assets/hljs-DKHsPV9u.js">
  <link rel="stylesheet" crossorigin href="./assets/markdown-D4q-1yIy.css">
  <link rel="stylesheet" crossorigin href="./assets/index-DSzv7riT.css">
</head>
<body>

<!-- ══════════════ ПАНЕЛЬ ІНСТРУМЕНТІВ ══════════════ -->
<header id="toolbar">
  <div class="logo" title="mdconv">
    <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 13l-2 2 2 2M15 13l2 2-2 2"/></svg></div>
    <span class="logo-text">mdconv</span>
  </div>

  <div class="dropdown mobile-only">
    <button class="btn btn-icon menu-btn" id="moreBtn" title="Меню"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
    <div class="dropdown-menu" id="menu-more"></div>
  </div>

  <nav class="menubar" id="menubar">
    <div class="dropdown"><button class="menu-btn" data-menu="file">Файл</button><div class="dropdown-menu" id="menu-file"></div></div>
    <div class="dropdown"><button class="menu-btn" data-menu="format">Формат</button><div class="dropdown-menu" id="menu-format"></div></div>
    <div class="dropdown"><button class="menu-btn" data-menu="text">Текст</button><div class="dropdown-menu" id="menu-text"></div></div>
    <div class="dropdown"><button class="menu-btn" data-menu="export">Експорт</button><div class="dropdown-menu" id="menu-export"></div></div>
  </nav>

  <div class="tb-sep"></div>

  <div class="dropdown">
    <button class="mode-btn" id="modeBtn" title="Мова / формат вкладки">
      <span class="mode-dot" id="modeDot"></span><span id="modeLabel">Markdown</span>
      <svg class="chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="dropdown-menu mode-menu" id="modeMenu">
      <input type="text" class="menu-search" id="modeSearch" placeholder="Знайти формат…" autocomplete="off">
      <div id="modeList"></div>
    </div>
  </div>

  <div class="fmt-group" id="mdTools">
    <button class="btn btn-icon" data-md="bold" title="Жирний (Ctrl+B)"><svg viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 014 4 4 4 0 01-4 4H6z"/><path d="M6 12h9a4 4 0 014 4 4 4 0 01-4 4H6z"/></svg></button>
    <button class="btn btn-icon" data-md="italic" title="Курсив (Ctrl+I)"><svg viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg></button>
    <button class="btn btn-icon" data-md="strike" title="Закреслений"><svg viewBox="0 0 24 24"><path d="M17 9V5H7v4"/><line x1="4" y1="12" x2="20" y2="12"/><path d="M9 19h6"/><path d="M12 12v7"/></svg></button>
    <button class="btn btn-icon" data-md="heading" title="Заголовок"><svg viewBox="0 0 24 24"><path d="M6 4v16M18 4v16M6 12h12"/></svg></button>
    <button class="btn btn-icon" data-md="list" title="Список"><svg viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg></button>
    <button class="btn btn-icon" data-md="task" title="Список завдань"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="M4.5 8l1 1 2-2"/><line x1="12" y1="8" x2="21" y2="8"/><rect x="3" y="14" width="6" height="6" rx="1"/><line x1="12" y1="17" x2="21" y2="17"/></svg></button>
    <button class="btn btn-icon" data-md="quote" title="Цитата"><svg viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5H3v7h4c0 4-2 6-4 6M14 21c3 0 7-1 7-8V5h-7v7h4c0 4-2 6-4 6"/></svg></button>
    <button class="btn btn-icon" data-md="code" title="Код"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
    <button class="btn btn-icon" data-md="link" title="Посилання (Ctrl+K)"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></button>
    <button class="btn btn-icon" data-md="table" title="Таблиця"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="3" x2="12" y2="21"/></svg></button>
    <button class="btn btn-icon" data-md="math" title="Формула KaTeX"><svg viewBox="0 0 24 24"><path d="M3 10h4l3-7 4 14 3-7h4"/></svg></button>
  </div>

  <div class="tb-spacer"></div>

  <button class="palette-btn" id="paletteBtn" title="Палітра команд (Ctrl+Shift+P)">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/></svg>
    <span class="palette-text">Команди…</span><kbd>Ctrl⇧P</kbd>
  </button>

  <div class="segmented" id="viewSeg" role="tablist" aria-label="Режим перегляду">
    <button data-view="editor" title="Лише редактор"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="14" y2="9"/><line x1="7" y1="13" x2="17" y2="13"/></svg></button>
    <button data-view="split" title="Редактор і превʼю (Ctrl+\)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="12" y1="4" x2="12" y2="20"/></svg></button>
    <button data-view="preview" title="Лише превʼю"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>

  <button class="btn btn-icon hide-sm" id="btnSidebar" title="Структура документа"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg></button>
  <button class="btn btn-icon hide-sm" id="btnFocus" title="Фокус-режим (F11)"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg></button>

  <div class="dropdown">
    <button class="btn btn-icon" id="btnTheme" title="Тема і шрифт"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c1.1 0 1.8-.9 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.8-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 004-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="10.5" r="1.2"/><circle cx="11" cy="7" r="1.2"/><circle cx="16" cy="8" r="1.2"/></svg></button>
    <div class="dropdown-menu right" id="themeMenu"></div>
  </div>
  <button class="btn btn-icon" id="btnSettings" title="Налаштування"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>
</header>

<!-- ══════════════ ВКЛАДКИ ══════════════ -->
<nav id="tabs-bar">
  <div id="tabsList" role="tablist"></div>
  <button class="tab-add" id="tabAdd" title="Нова вкладка (Alt+N)">+</button>
</nav>

<!-- ══════════════ ОСНОВНА ОБЛАСТЬ ══════════════ -->
<main id="main" data-view="split">
  <aside id="sidebar">
    <div class="pane-bar"><span class="pane-label" id="sidebarTitle">Структура</span></div>
    <div id="outline"></div>
  </aside>

  <section class="pane" id="editorPane">
    <div id="editorHost"></div>
    <div class="drag-overlay" id="dragOverlay">
      <svg viewBox="0 0 24 24"><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/><polyline points="7 9 12 4 17 9"/><line x1="12" y1="4" x2="12" y2="16"/></svg>
      <span>Відпустіть, щоб відкрити файли</span>
    </div>
  </section>

  <div id="splitter" role="separator" aria-orientation="vertical" title="Перетягніть, щоб змінити ширину"></div>

  <section class="pane" id="previewPane">
    <div class="pane-bar">
      <span class="pane-label" id="previewTitle">Попередній перегляд</span>
      <div class="segmented small" id="dataSeg" hidden>
        <button data-dv="tree" class="active">Дерево</button>
        <button data-dv="table">Таблиця</button>
      </div>
      <input type="search" class="pane-filter" id="dataFilter" placeholder="Фільтр…" hidden>
      <span class="pane-info" id="previewInfo"></span>
      <div class="pane-actions" id="previewActions"></div>
    </div>
    <div id="previewBody">
      <div class="view md-wrap" id="mdView"><article class="md-body" id="mdOutput"></article></div>
      <div class="view data-wrap" id="dataView"><div id="treeHost"></div><div id="tableHost" hidden></div></div>
      <div class="view frame-wrap" id="htmlView"><iframe id="htmlFrame" sandbox="allow-scripts allow-modals allow-forms" title="Превʼю HTML"></iframe></div>
      <div class="view svg-wrap" id="svgView"><img id="svgImg" alt="Превʼю SVG"></div>
      <div class="view state-view" id="emptyView"></div>
      <div class="view state-view error" id="errorView"></div>
    </div>
  </section>
</main>

<!-- ══════════════ СТАТУС-РЯДОК ══════════════ -->
<footer id="statusbar">
  <button class="sb-item sb-mode" id="sbMode" title="Змінити формат"><span class="mode-dot" id="sbModeDot"></span><span id="sbModeLabel"></span></button>
  <button class="sb-item" id="sbPos" title="Перейти до рядка (Ctrl+G)">Рд 1, Ст 1</button>
  <span class="sb-item" id="sbSel"></span>
  <button class="sb-item sb-lint" id="sbLint" hidden></button>
  <span class="sb-spacer"></span>
  <span class="sb-item hide-sm" id="sbStats"></span>
  <button class="sb-item hide-sm" id="sbIndent" title="Розмір відступу"></button>
  <button class="sb-item hide-sm" id="sbWrap" title="Перенос рядків"></button>
  <span class="sb-item" id="sbSaved" title="Стан збереження"></span>
</footer>

<!-- ══════════════ МОДАЛЬНІ ВІКНА ══════════════ -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal" role="dialog" aria-labelledby="settingsTitle">
    <div class="modal-header"><h2 id="settingsTitle">Налаштування</h2><button class="modal-close" data-close>×</button></div>
    <div class="modal-body" id="settingsBody"></div>
    <div class="modal-footer"><span class="muted" id="storageInfo"></span><button class="btn btn-primary" data-close>Готово</button></div>
  </div>
</div>

<div class="modal-backdrop" id="templatesModal">
  <div class="modal modal-wide" role="dialog" aria-labelledby="tplTitle">
    <div class="modal-header"><h2 id="tplTitle">Новий документ із шаблону</h2><button class="modal-close" data-close>×</button></div>
    <div class="modal-body"><div class="templates-grid" id="templatesGrid"></div></div>
  </div>
</div>

<div class="modal-backdrop" id="diffModal">
  <div class="modal modal-full" role="dialog" aria-labelledby="diffTitle">
    <div class="modal-header">
      <h2 id="diffTitle">Порівняння</h2>
      <select id="diffLeft" class="select"></select><span class="muted">⇄</span><select id="diffRight" class="select"></select>
      <span class="pane-info" id="diffInfo"></span>
      <button class="modal-close" data-close>×</button>
    </div>
    <div class="diff-host" id="diffHost"></div>
  </div>
</div>

<div class="modal-backdrop palette-backdrop" id="paletteModal">
  <div class="palette" role="dialog" aria-label="Палітра команд">
    <input type="text" id="paletteInput" placeholder="Введіть назву команди або формату…" autocomplete="off" spellcheck="false">
    <div id="paletteList" role="listbox"></div>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> вибір</span><span><kbd>Enter</kbd> виконати</span><span><kbd>Esc</kbd> закрити</span></div>
  </div>
</div>

<div class="modal-backdrop" id="askModal">
  <form class="modal modal-small" id="askForm">
    <div class="modal-header"><h2 id="askTitle"></h2></div>
    <div class="modal-body">
      <label class="field"><span id="askLabel"></span><input type="text" id="askInput" autocomplete="off"></label>
      <p class="muted" id="askHint"></p>
    </div>
    <div class="modal-footer"><button type="button" class="btn" id="askCancel">Скасувати</button><button type="submit" class="btn btn-primary" id="askOk">OK</button></div>
  </form>
</div>

<input type="file" id="fileInput" multiple hidden>
<div id="toasts" aria-live="polite"></div>
<div id="printArea"></div>

</body>
</html>
